<style>
.rep-finder {
  --rep-navy: var(--color-navy, #0d1d3b);
  --rep-cyan: var(--color-cyan, #1eb9dc);
  --rep-white: var(--color-white, #fff);
  --rep-border: var(--color-border, #d8dde5);
  width: 100%;
  padding: clamp(1.25rem, 2.5vw, 1.75rem);
  border: 2px solid var(--rep-cyan);
  border-radius: 4px;
  color: var(--rep-navy);
}

.rep-finder *,
.rep-finder *::before,
.rep-finder *::after {
  box-sizing: border-box;
}

.rep-finder__header {
  margin-bottom: 1.6rem;
}

.rep-finder__header h3 {
  margin: 0 0 0.45rem;
  color: var(--rep-navy);
  font-size: clamp(1.7rem, 2.8vw, 2.2rem);
  line-height: 1.12;
}

.rep-finder__header p {
  max-width: 620px;
  margin: 0;
  color: color-mix(in srgb, var(--rep-navy) 72%, var(--rep-white));
  line-height: 1.6;
}

.rep-finder__search {
  position: relative;
}

.rep-finder__label {
  display: block;
  margin-bottom: 0.5rem;
  color: var(--rep-navy);
  font-weight: 700;
}

.rep-finder__input-wrap {
  position: relative;
}

.rep-finder__icon {
  position: absolute;
  top: 50%;
  left: 1rem;
  width: 1.25rem;
  height: 1.25rem;
  color: var(--rep-navy);
  transform: translateY(-50%);
  pointer-events: none;
}

.rep-finder__input {
  width: 100%;
  min-height: 56px;
  padding: 0.85rem 5.25rem 0.85rem 3rem;
  border: 2px solid var(--rep-navy);
  border-radius: 3px;
  background: var(--rep-white);
  color: var(--rep-navy);
  font: inherit;
}

.rep-finder__input::placeholder {
  color: color-mix(in srgb, var(--rep-navy) 48%, var(--rep-white));
}

.rep-finder__input:focus {
  border-color: var(--rep-navy);
  outline: none;
}

.rep-finder__clear {
  position: absolute;
  top: 50%;
  right: 0.75rem;
  display: none;
  padding: 0.35rem 0.55rem;
  border: 0;
  background: transparent;
  color: var(--rep-navy);
  font: inherit;
  font-size: 0.86rem;
  font-weight: 700;
  cursor: pointer;
  transform: translateY(-50%);
}

.rep-finder__clear.is-visible {
  display: block;
}

.rep-finder__status {
  min-height: 1.5rem;
  margin: 0.75rem 0 0;
  color: color-mix(in srgb, var(--rep-navy) 68%, var(--rep-white));
  font-size: 0.9rem;
}

.rep-finder__results {
  display: none;
  margin: 1.35rem 0 0;
  padding: 0;
  border-top: 1px solid var(--rep-border);
  list-style: none;
}

.rep-finder__results.is-visible {
  display: block;
}

.rep-finder__result {
  display: grid;
  grid-template-columns: minmax(170px, 0.75fr) minmax(0, 1.25fr);
  gap: 1rem 2rem;
  padding: 1.2rem 0;
  border-bottom: 1px solid var(--rep-border);
}

.rep-finder__name {
  min-width: 0;
}

.rep-finder__name strong {
  display: block;
  margin-bottom: 0.2rem;
  color: var(--rep-navy);
  font-size: 1rem;
}

.rep-finder__name span {
  color: var(--rep-cyan);
  font-size: 0.82rem;
  font-weight: 700;
}

.rep-finder__details {
  min-width: 0;
}

.rep-finder__details p {
  margin: 0;
  color: color-mix(in srgb, var(--rep-navy) 76%, var(--rep-white));
  line-height: 1.45;
}

.rep-finder__details small {
  display: block;
  margin-top: 0.3rem;
  color: color-mix(in srgb, var(--rep-navy) 58%, var(--rep-white));
  line-height: 1.4;
}

.rep-finder__empty {
  margin: 1.25rem 0 0;
  padding: 1rem 0;
  border-top: 1px solid var(--rep-border);
  color: color-mix(in srgb, var(--rep-navy) 70%, var(--rep-white));
}

@media (max-width: 640px) {
  .rep-finder {
    padding: 1rem;
  }

  .rep-finder__result {
    grid-template-columns: 1fr;
    gap: 0.55rem;
  }

  .rep-finder__input {
    padding-right: 4.6rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .rep-finder__input {
    scroll-behavior: auto;
  }
}
</style>

<div class="rep-finder" data-rep-finder>
  <div class="rep-finder__header">
    <h3>Find your rep</h3>
    <p>
      Search by your course, school or a representative's name.
    </p>
  </div>

  <div class="rep-finder__search">
    <label class="rep-finder__label" for="rep-finder-search">
      Search for a Course or Senior Rep
    </label>

    <div class="rep-finder__input-wrap">
      <svg
        class="rep-finder__icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.5-3.5"></path>
      </svg>

      <input
        class="rep-finder__input"
        id="rep-finder-search"
        type="search"
        inputmode="search"
        autocomplete="off"
        placeholder="e.g. Psychology Year 2, School of Law or a rep name"
        aria-controls="rep-finder-results"
        aria-describedby="rep-finder-status"
      >

      <button
        class="rep-finder__clear"
        type="button"
        aria-label="Clear rep search"
      >
        Clear
      </button>
    </div>

    <p
      class="rep-finder__status"
      id="rep-finder-status"
      role="status"
      aria-live="polite"
    >
      Start typing to find your rep.
    </p>
  </div>

  <ul
    class="rep-finder__results"
    id="rep-finder-results"
    aria-label="Representative search results"
  ></ul>

  <p class="rep-finder__empty" hidden>
    No representatives match that search. Try your course name, school or a broader search term.
  </p>
</div>

  const input = root.querySelector(".rep-finder__input");
  const clearButton = root.querySelector(".rep-finder__clear");
  const results = root.querySelector(".rep-finder__results");
  const status = root.querySelector(".rep-finder__status");
  const empty = root.querySelector(".rep-finder__empty");

  const MAX_RESULTS = 20;

  const normalise = value =>
    value
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, " ")
      .trim();

  const searchableReps = reps.map(rep => ({
    data: rep,
    search: normalise(rep.join(" "))
  }));

  function createResult(rep) {
    const [name, position, course, school] = rep;

    const item = document.createElement("li");
    item.className = "rep-finder__result";

    const nameBlock = document.createElement("div");
    nameBlock.className = "rep-finder__name";

    const nameText = document.createElement("strong");
    nameText.textContent = name;

    const roleText = document.createElement("span");
    roleText.textContent = position;

    nameBlock.append(nameText, roleText);

    const detailBlock = document.createElement("div");
    detailBlock.className = "rep-finder__details";

    const courseText = document.createElement("p");
    courseText.textContent = course;

    const schoolText = document.createElement("small");
    schoolText.textContent = school;

    detailBlock.append(courseText, schoolText);
    item.append(nameBlock, detailBlock);

    return item;
  }

  function render() {
    const query = normalise(input.value);
    const tokens = query.split(" ").filter(Boolean);

    results.replaceChildren();
    results.classList.remove("is-visible");
    empty.hidden = true;
    clearButton.classList.toggle("is-visible", input.value.length > 0);

    if (query.length < 2) {
      status.textContent = input.value
        ? "Type at least two characters to search."
        : "Start typing to find your rep.";
      return;
    }

    const matches = searchableReps.filter(rep =>
      tokens.every(token => rep.search.includes(token))
    );

    if (!matches.length) {
      status.textContent = "No representatives found.";
      empty.hidden = false;
      return;
    }

    const visibleMatches = matches.slice(0, MAX_RESULTS);
    const fragment = document.createDocumentFragment();

    visibleMatches.forEach(rep => {
      fragment.appendChild(createResult(rep.data));
    });

    results.appendChild(fragment);
    results.classList.add("is-visible");

    status.textContent =
      matches.length > MAX_RESULTS
        ? `Showing the first ${MAX_RESULTS} of ${matches.length} matching representatives. Add more detail to narrow your search.`
        : `${matches.length} ${matches.length === 1 ? "representative" : "representatives"} found.`;
  }

  input.addEventListener("input", render);

  clearButton.addEventListener("click", () => {
    input.value = "";
    render();
    input.focus();
  });
})();
